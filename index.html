          }
        });

        estoqueGlobal = await resposta.json();
        
        // Mapeia cada registro adicionando a coluna 'setor' correspondente ao local
        estoqueGlobal = estoqueGlobal.map(item => {
          const localCod = (item.local || "").trim();
          return {
            ...item,
            setor: MAPA_SETORES[localCod] || "OUTROS / NÃO MAPEADO"
          };
        });

        status.innerText = `Total de registros carregados: ${estoqueGlobal.length}`;
        renderizarTabela(estoqueGlobal);

      } catch (erro) {
        status.innerText = "Erro ao carregar dados do Supabase.";
        console.error(erro);
      }
    }

    // Função para desenhar as linhas na tabela
    function renderizarTabela(dados) {
      const tbody = document.getElementById("tabelaCorpo");
      tbody.innerHTML = "";

      dados.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="badge-setor">${item.setor}</span></td>
          <td><strong>${item.local || ''}</strong></td>
          <td>${item.codigo_produto || ''}</td>
          <td>${item.descricao || ''}</td>
          <td>${item.quantidade || 0}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Função para aplicar os dois filtros ao mesmo tempo
    function aplicarFiltros() {
      const setorSelecionado = document.getElementById("selectSetor").value.toLowerCase();
      const buscaTexto = document.getElementById("inputBusca").value.toLowerCase();

      const dadosFiltrados = estoqueGlobal.filter(item => {
        const bateSetor = setorSelecionado === "" || item.setor.toLowerCase() === setorSelecionado;
        
        const bateTexto = buscaTexto === "" || 
          (item.local && item.local.toLowerCase().includes(buscaTexto)) ||
          (item.codigo_produto && item.codigo_produto.toLowerCase().includes(buscaTexto)) ||
          (item.descricao && item.descricao.toLowerCase().includes(buscaTexto));

        return bateSetor && bateTexto;
      });

      renderizarTabela(dadosFiltrados);
      document.getElementById("status").innerText = `Exibindo ${dadosFiltrados.length} de ${estoqueGlobal.length} registros.`;
    }

    // Escutadores de eventos nos filtros
    document.getElementById("selectSetor").addEventListener("change", aplicarFiltros);
    document.getElementById("inputBusca").addEventListener("input", aplicarFiltros);

    // Carrega os dados assim que abre a página
    carregarEstoque();
